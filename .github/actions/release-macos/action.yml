name: Release macOS

description: Build and sign macOS DMGs and Tauri updater archives, attach DMGs to the release, and publish updates to R2

inputs:
  tag:
    description: Release tag (empty builds without releasing)
    required: false
    default: ''
  github-token:
    description: Token that can upload release files
    required: true
  certificate:
    description: Base64-encoded .p12 signing certificate
    required: false
    default: ''
  certificate-password:
    description: Password for the .p12 certificate
    required: false
    default: ''
  tauri-signing-private-key:
    description: Private key that signs Tauri updater bundles
    required: false
    default: ''
  tauri-signing-private-key-password:
    description: Password for the Tauri signing private key
    required: false
    default: ''
  cloudflare-api-token:
    description: Token for the release bucket
    required: false
    default: ''
  cloudflare-account-id:
    description: Cloudflare account ID for the release bucket
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Prepare Node.js and pnpm
      uses: zgid123/alpha-dx/gh-actions/preparation/nodejs@main

    - name: Prepare Rust
      uses: zgid123/alpha-dx/gh-actions/preparation/rust@main
      with:
        toolchain: stable
        targets: aarch64-apple-darwin x86_64-apple-darwin
        cache-key: release-macos

    - name: Build workspace host
      shell: bash
      run: pnpm turbo run build --filter=@slidevision/workspace

    - name: Import signing certificate
      if: inputs.certificate != '' || inputs.tag != ''
      shell: bash
      env:
        CERTIFICATE: ${{ inputs.certificate }}
        CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        set -euo pipefail

        if [ -z "$CERTIFICATE" ]; then
          echo "::error::A release needs the MACOS_CERTIFICATE secret."
          exit 1
        fi

        keychain="$RUNNER_TEMP/macos-signing.keychain-db"
        keychain_password=$(openssl rand -hex 16)
        echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/macos-signing.p12"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        # A pasted password secret may include trailing CR/LF.
        password=$(printf '%s' "$CERTIFICATE_PASSWORD" | tr -d '\r\n')
        security import "$RUNNER_TEMP/macos-signing.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
        rm -f "$RUNNER_TEMP/macos-signing.p12"

        identity=$(security find-identity -p codesigning "$keychain" | grep -m1 -oE '[0-9A-F]{40}' || true)
        if [ -z "$identity" ]; then
          echo "::error::No code signing identity found in the imported certificate."
          exit 1
        fi

        echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
        echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

    - name: Build macOS bundles
      id: build
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.tauri-signing-private-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.tauri-signing-private-key-password }}
      run: |
        set -euo pipefail

        if [ -n "$TAG" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
          echo "::error::A release needs the TAURI_SIGNING_PRIVATE_KEY secret, or the updater cannot verify it."
          exit 1
        fi

        version="${TAG##*@}"
        if [ -z "$version" ]; then
          version=$(node -p "require('./workspaces/slidevision/package.json').version")
        fi

        out="$RUNNER_TEMP/macos"
        mkdir -p "$out"
        target_root="${CARGO_TARGET_DIR:-target}"

        build_arch() {
          local arch="$1"
          local triple="$2"

          pnpm --filter @slidevision/desktop tauri build --target "$triple" --bundles app,dmg

          local bundle_dir="$target_root/$triple/release/bundle"
          local archive
          archive=$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app.tar.gz' ! -name '*.sig' | head -n 1)
          local dmg
          dmg=$(find "$bundle_dir/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)

          if [ -z "$archive" ] || [ -z "$dmg" ]; then
            echo "::error::Missing macOS artifacts for $triple in $bundle_dir."
            exit 1
          fi

          cp "$archive" "$out/Slidevision-darwin-$arch.app.tar.gz"
          cp "$dmg" "$out/Slidevision-$version-darwin-$arch.dmg"

          if [ -f "$archive.sig" ]; then
            cp "$archive.sig" "$out/Slidevision-darwin-$arch.app.tar.gz.sig"
          elif [ -n "$TAG" ]; then
            echo "::error::Missing updater signature $archive.sig."
            exit 1
          fi
        }

        build_arch aarch64 aarch64-apple-darwin
        build_arch x86_64 x86_64-apple-darwin

        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Remove signing keychain
      if: always() && env.SIGN_KEYCHAIN != ''
      shell: bash
      run: security delete-keychain "$SIGN_KEYCHAIN"

    - name: Attach DMGs to GitHub release
      if: inputs.tag != ''
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        version="${TAG##*@}"
        gh release upload "$TAG" \
          "$RUNNER_TEMP/macos/Slidevision-$version-darwin-aarch64.dmg" \
          "$RUNNER_TEMP/macos/Slidevision-$version-darwin-x86_64.dmg" \
          --clobber

    - name: Publish update
      if: inputs.tag != ''
      uses: ./.github/actions/publish-update
      with:
        tag: ${{ inputs.tag }}
        platform: darwin
        files: |
          aarch64=${{ runner.temp }}/macos/Slidevision-darwin-aarch64.app.tar.gz
          x86_64=${{ runner.temp }}/macos/Slidevision-darwin-x86_64.app.tar.gz
        installers: |
          aarch64=${{ runner.temp }}/macos/Slidevision-${{ steps.build.outputs.version }}-darwin-aarch64.dmg
          x86_64=${{ runner.temp }}/macos/Slidevision-${{ steps.build.outputs.version }}-darwin-x86_64.dmg
        cloudflare-api-token: ${{ inputs.cloudflare-api-token }}
        cloudflare-account-id: ${{ inputs.cloudflare-account-id }}
