name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.changeset/*.md'
      - 'workspaces/website/**'
      - '.github/actions/test-website/**'
  # By hand: without a tag, build the desktop app for both platforms without
  # releasing. With a tag (@slidevision/desktop@X.Y.Z or @slidevision/server@X.Y.Z),
  # publish that release again: its code from the tag, the release steps from this branch.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again (empty builds the desktop app without releasing)
        required: false
        default: ''

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      changes: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: zgid123/alpha-dx/gh-actions/detect-changes@main
        with:
          filters: |
            changeset = ^\.changeset/.*\.md$
            website   = ^workspaces/website/|^\.github/actions/test-website/

  release:
    name: Release Changes
    needs: changes
    if: >-
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          needs.changes.result == 'success' &&
          fromJSON(needs.changes.outputs.changes).changeset
        )
      )
    runs-on: ubuntu-latest

    outputs:
      app-tag: ${{ steps.release.outputs.app-tag }}
      server-tag: ${{ steps.release.outputs.server-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release changes
        id: release
        uses: ./.github/actions/release-changes
        with:
          tag: ${{ inputs.tag || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    name: Release macOS
    needs: release
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      (needs.release.outputs.app-tag != '' || (github.event_name == 'workflow_dispatch' && inputs.tag == ''))
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.app-tag || github.ref }}

      # Publishing a tag again: keep the tag's code, but use the release
      # steps of this run, which may hold fixes made after the tag.
      - name: Use this run's release steps
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout FETCH_HEAD -- .github/actions scripts

      - name: Build and release macOS
        uses: ./.github/actions/release-macos
        with:
          tag: ${{ needs.release.outputs.app-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  release-windows:
    name: Release Windows
    needs: release
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      (needs.release.outputs.app-tag != '' || (github.event_name == 'workflow_dispatch' && inputs.tag == ''))
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.app-tag || github.ref }}

      # Publishing a tag again: keep the tag's code, but use the release
      # steps of this run, which may hold fixes made after the tag.
      - name: Use this run's release steps
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout FETCH_HEAD -- .github/actions scripts

      - name: Build and release Windows
        uses: ./.github/actions/release-windows
        with:
          tag: ${{ needs.release.outputs.app-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  release-server:
    name: Release Server
    needs: release
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.release.outputs.server-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.server-tag }}

      - name: Deploy server
        uses: zgid123/alpha-dx/gh-actions/deployment/cloudflare-workers-node@main
        with:
          filter: '@slidevision/server'
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # Verify website tests before deploying on website pushes.
  test-website:
    name: Test Website
    needs: changes
    if: github.event_name != 'workflow_dispatch' && fromJSON(needs.changes.outputs.changes).website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test website
        uses: ./.github/actions/test-website

  # Rebuild the download and documentation site after a desktop release or a website push on main.
  deploy-website:
    name: Deploy Website
    needs: [release, release-macos, release-windows, test-website]
    if: >-
      !cancelled() &&
      (needs.test-website.result == 'success' || needs.test-website.result == 'skipped') &&
      (
        (github.event_name == 'push' && needs.test-website.result == 'success') ||
        (needs.release.result == 'success' && needs.release.outputs.app-tag != '' && (needs.release-macos.result == 'success' || needs.release-windows.result == 'success'))
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.website.outputs.page-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy website
        id: website
        uses: zgid123/alpha-dx/gh-actions/deployment/app-landing-vitepress@main
        with:
          bucket: slidevision
          platforms: darwin windows
          releases-dir-env: SLIDEVISION_RELEASES_DIR
          wrangler-filter: '@slidevision/server'
          website-filter: '@slidevision/website'
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
