[package]
authors = ["Alpha"]
description = "Open a Slidev project and present it on two screens"
edition = "2024"
license = "MIT"
name = "slidevision"
publish = false
version = "0.0.0"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "slidevision_lib"

[build-dependencies]
tauri-build = {version = "=2.7.6", features = [] }

[dependencies]
serde = {version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = {version = "=2.12.7", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.4"
