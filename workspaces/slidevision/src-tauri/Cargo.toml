[package]
authors = ["Alpha"]
description = "Open a Slidev project and present it on two screens"
edition = "2024"
license = "MIT"
name = "slidevision"
publish = false
version = "0.0.0"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "slidevision_lib"

[build-dependencies]
tauri-build = {version = "=2.7.6", features = []}

[dependencies]
serde = {version = "=1.0.229", features = ["derive"]}
serde_json = "=1.0.154"
tauri = {version = "=2.12.7", features = ["protocol-asset"]}
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.14.1"
url = "=2.5.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = {version = "=0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"]}
